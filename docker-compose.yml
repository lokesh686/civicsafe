# Docker Compose for local development and production
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: civicsafe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-civicsafe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicsafe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicsafe-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-civicsafe}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-civicsafe}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      HASHING_SCHEME: bcrypt
      API_URL: ${API_URL:-http://localhost:8000}
      ANALYTICS_EXCEL_PATH: /app/analytics/analytics.xlsx
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}
    volumes:
      - ./backend/analytics:/app/analytics
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Web)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicsafe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: